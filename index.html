<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <meta name="description" content="Registro de asistencia a eventos" > <title>Registro de asistencia</title> <link rel="stylesheet" href="css/styles.css"> </head> <body> <header class="site-header"> <div class="container"> <h1>Registro de asistencia</h1> </div> </header> <main class="container"> <section class="attendance-card" aria-labelledby="attendance-title"> <header class="attendance-card__header"> <p class="event-label"> Evento </p> <h2 id="attendance-title"> Nombre del evento </h2> <p class="event-date"> 23 de septiembre de 2026 </p> </header> <form id="attendance-form"> <div class="form-group"> <label for="name"> Nombre completo </label> <input type="text" id="name" name="name" autocomplete="name" required > </div> <div class="form-group"> <label for="rut"> RUT </label> <input type="text" id="rut" name="rut" autocomplete="off" inputmode="text" placeholder="12.345.678-9" required > </div> <div class="form-group"> <label for="phone"> Teléfono </label> <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="+56 9 1234 5678" required > </div> <div class="form-group"> <label for="email"> Correo electrónico </label> <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="correo@ejemplo.com" required > </div> <button type="submit" class="submit-button" > Registrar asistencia </button> </form> <p class="signature-notice"> Después de registrar tus datos, dirígete a la tablet del encargado para realizar tu firma. </p> </section> </main> <footer class="site-footer"> <div class="container"> <p> Sistema de Registro de Asistencia </p> </div> </footer> <script src="js/app.js"></script> </body> </html>
